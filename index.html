<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="calculadora">
    <!-- Cabeçalho com indicador de design -->
    <header class="topo-calculadora">
      <div class="indicador-topo"></div>
      <h1 class="titulo-app">Calculadora</h1>
    </header>

    <!-- Painel do Visor de Resultados -->
    <section class="painel-visor">
      <span class="rotulo-resultado">Resultado</span>
      <div class="visor-principal" id="resultado">0</div>
    </section>

    <!-- Campos de Entrada de Dados -->
    <section class="painel-entradas">
      <div class="grupo-input">
        <label for="numero1">Primeiro Número</label>
        <input type="number" id="numero1" step="any" placeholder="0">
      </div>

      <div class="grupo-input">
        <label for="numero2">Segundo Número</label>
        <input type="number" id="numero2" step="any" placeholder="0">
      </div>
    </section>

    <!-- Teclado de Operações -->
    <section class="teclado-operacoes">
      <button type="button" class="btn-operador" onclick="Somar()">+</button>
      <button type="button" class="btn-operador" onclick="Subtrair()">−</button>
      <button type="button" class="btn-operador" onclick="Multiplicar()">×</button>
      <button type="button" class="btn-operador" onclick="Dividir()">÷</button>
      <button type="button" class="btn-limpar" onclick="Limpar()">Limpar</button>
    </section>
  </main>

  <!-- Conexão com o arquivo JavaScript externo -->
  <script src="script.js"></script>
</body>
</html>
